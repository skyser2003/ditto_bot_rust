[package]
name = "ditto-bot-rust"
version = "0.1.0"
authors = [
	"장승호(Seung Ho Jang) <shjang1992@gmail.com>",
	"Seungmin Lee <elenesgu@gmail.com>",
]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
regex = "1"
url = "2"
anyhow = "1.0"
thiserror = "2.0.21"
async-trait = "0.1"
bytes = "1.8"
base64 = "0.23.1"
pulldown-cmark = { version = "0.13", default-features = false }
linkify = "0.11.0"
once_cell = "1"

reqwest = { version = "0.12.28", features = [
	"http2",
	"json",
	"rustls-tls",
	"stream",
], default-features = false }
tokio = { version = "1", features = ["full"] }

axum = "0.8.9"
axum-server = { version = "0.9.2", features = ["tls-rustls-no-provider"], optional = true }
tower-http = { version = "0.7.1", features = ["auth"] }
tower = { version = "0.5", features = ["util"] }
http = "1.1"
hyper = "1.5"
tokio-tungstenite = { version = "0.30.0", features = [
	"rustls-tls-webpki-roots",
] }

rustls = { version = "0.23.46", default-features = false, features = [
	"ring",
	"std",
	"tls12",
] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

hmac = "0.13.0"
sha2 = "0.11.1"

futures = "0.3"
rand = "0.10.4"

log = "0.4.11"
env_logger = "0.11.11"
reqwest-eventsource = "0.6.0"
percent-encoding = "2.3.1"

rmcp = { version = "3.11.0", default-features = false, features = [
	"client",
	"transport-child-process",
] }

[features]
check-req = []
use-ssl = ["axum-server"]
